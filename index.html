<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharky - Get ready to Swim</title>
    <link rel="icon" href="img/1.Sharkie/3.Swim/1.png" sizes="48x48" >
    <link rel="stylesheet" href="style.css">
    <script defer src="js/models/World.js"></script>
    <script defer src="js/models/DrawableObject.js"></script>
    <script defer src="js/models/MoveableObject.js"></script>
    <script defer src="js/models/StatusBar.js"></script>
    <script defer src="js/models/HealthBar.js"></script>
    <script defer src="js/models/Coin.js"></script>
    <script defer src="js/models/PoisonBottle.js"></script>
    <script defer src="js/models/CoinsBar.js"></script>
    <script defer src="js/models/BubblesBar.js"></script>
    <script defer src="js/models/Bubble.js"></script>
    <script defer src="js/models/Character.js"></script>
    <script defer src="js/models/PufferFish.js"></script>
    <script defer src="js/models/JellyFish.js"></script>
    <script defer src="js/models/Endboss.js"></script>
    <script defer src="js/models/BackgroundObject.js"></script>
    <script defer src="js/models/Keyboard.js"></script>
    <script defer src="js/models/Level.js"></script>
    <script defer src="js/levels/level1.js"></script>

</head>
<body style="display:flex; justify-content:center; align-items:center; flex-direction:column">
    <div id="soundBar">
        <button id="soundButton" style="width:60px;height:60px;"  title="Sound an">🔇</button>
    </div>
    <p id="verticalModeMessage" class="hidden">Bitte im Querformat spielen</p>
    <div class="screen centeredFlex littleGap" id="mainMenu">
        <button id="startButton" onclick="startNewGame()">Start</button>
    </div>
    <canvas width="720" height="530" class="screen hidden" id="canvas"></canvas>
</body>
<script>
        canvas.width = 720;
        canvas.height = 530;
        const soundBar = document.getElementById('soundBar');
        const soundButton = document.getElementById('soundButton');
        window.intervals = [];

        window.setStoppableInterval = (fn, time) => {
            const interval = { fn, time, id: setInterval(fn, time) };
            window.intervals.push(interval);
        };

        window.pauseGame = () => {
            window.intervals.forEach(interval => {
                clearInterval(interval.id);
                interval.id = null;
            });
        };

        window.resumeGame = () => {
            window.intervals.forEach(interval => {
                if (interval.id === null) {
                    interval.id = setInterval(interval.fn, interval.time);
                }
            });
        };

        window.stopGame = () => {
            window.intervals.forEach(interval => clearInterval(interval.id));
            window.intervals = [];
        };
        window.sounds = {
                "mainBackground": new Audio("audio/underwater.mp3"),
                "coinCollected": new Audio("audio/coinCollected.mp3"),
                "bubbleShot": new Audio("audio/bubbleShot.mp3"),
                "poisonCollected": new Audio("audio/collectedPoisonCoin.mp3"),
                "won": new Audio("audio/won.mp3"),
                "lose": new Audio("audio/lose.mp3"),
        };
        Object.values(window.sounds).forEach(sound => {
            sound.muted = true;
        });
        soundButton.onclick = () => {
            // Toggle mute and unmute
            const soundValues = Object.values(window.sounds);
            soundValues.forEach((sound, index, array) => {
                console.log(index);
                console.log(array);
                console.log(sound);
                if(sound.muted === true){
                    sound.muted = false;
                } else{
                    sound.muted = true;
                }
                if(index === array.length-1){
                    if(sounds.mainBackground.muted)
                        soundButton.innerHTML = '🔇';
                    else{
                        soundButton.innerHTML = '🔊';
                        window.sounds.mainBackground.play();
                        window.sounds.mainBackground.loop = true;
                    }
                }
            });
        }
        // Mark that the listener has been set
        soundButton.setAttribute('data-listener-set', 'true');
        // Stop previous audio if it's running
        // Important: pause() stops playback, currentTime = 0 resets to beginning
        if (sounds && sounds.mainBackground) {
            sounds.mainBackground.pause();
            sounds.mainBackground.currentTime = 0;
        }
        // Set audio settings and start
        sounds.mainBackground.loop = true; // Infinite loop
</script>
</html>
